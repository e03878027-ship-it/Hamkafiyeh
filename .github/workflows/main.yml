
name: Build and Release Hamkafiyeh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;35.0.0" "platform-tools"

      - name: Install MAUI Android
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore Hamkafiyeh.csproj -p:TargetFrameworks=net9.0-android

      - name: Build APK
        run: |
          dotnet publish Hamkafiyeh.csproj \
            -f net9.0-android \
            -c Release \
            -p:TargetFrameworks=net9.0-android \
            -p:AndroidPackageFormats=apk \
            --no-restore \
            -o ./artifacts

      - name: Select and verify APK
        run: |
          set -e
          APK=$(find artifacts -maxdepth 1 -name '*-Signed.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "Signed APK was not found."
            exit 1
          fi

          TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep "launchable-activity"

          cp "$APK" artifacts/Hamkafiyeh.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hamkafiyeh v1.0.${{ github.run_number }}
          body: |
            نسخه اندروید اپلیکیشن همکفیه
          files: artifacts/Hamkafiyeh.apk
          fail_on_unmatched_files: true
