
name: Build Hamkafiyeh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;35.0.0" "platform-tools"

      - name: Configure Android project
        run: |
          sed -i 's#<TargetFrameworks>net9.0-android;net9.0-ios;net9.0-maccatalyst</TargetFrameworks>#<TargetFrameworks>net9.0-android</TargetFrameworks>#' Hamkafiyeh.csproj
          grep TargetFrameworks Hamkafiyeh.csproj

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Restore project
        run: dotnet restore Hamkafiyeh.csproj -p:TargetFrameworks=net9.0-android

      - name: Build Android APK
        run: |
          dotnet publish Hamkafiyeh.csproj \
            -f net9.0-android \
            -c Release \
            -p:TargetFrameworks=net9.0-android \
            -p:AndroidPackageFormats=apk \
            --no-restore \
            -o ./artifacts

      - name: Verify APK files
        run: |
          set +e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          for apk in artifacts/*.apk; do
            echo ""
            echo "======================================"
            echo "APK: $apk"
            echo "======================================"

            echo "RESULT 1 - ZIP INTEGRITY"
            unzip -t "$apk"
            echo "ZIP_EXIT_CODE=$?"

            echo ""
            echo "RESULT 2 - APK SIGNATURE"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk"
            echo "SIGNATURE_EXIT_CODE=$?"

            echo ""
            echo "RESULT 3 - APK ALIGNMENT"
            "$BUILD_TOOLS/zipalign" -c -v 4 "$apk"
            echo "ALIGNMENT_EXIT_CODE=$?"

            echo ""
            echo "RESULT 4 - PACKAGE INFORMATION"
            "$BUILD_TOOLS/aapt" dump badging "$apk" | head -n 10
            echo "======================================"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamkafiyeh-APK
          path: artifacts/*.apk
          if-no-files-found: error
